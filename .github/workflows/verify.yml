name: Verify scientific checks

on:
  push:
  pull_request:

jobs:
  finite-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r verification/requirements.txt
      - run: python verification/verify.py
